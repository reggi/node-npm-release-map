<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800" role="img" aria-labelledby="title description">
  <title id="title">npm release to Node.js release pipeline</title>
  <desc id="description">Five detectable states from an open npm release pull request through publication in a Node.js release.</desc>
  <defs>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2328; }
      .subtitle { font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #59636e; }
      .number { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
      .constant { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2328; text-anchor: middle; }
      .signal { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #3d444d; text-anchor: middle; }
      .legend { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #3d444d; }
      .how-title { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2328; }
      .how-text { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #3d444d; }
      .routing-label { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2328; }
      .command { font: 12px ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; fill: #f0f6fc; }
      .command-bg { fill: #0d1117; stroke: #30363d; stroke-width: 1; }
      .decision-title { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #7d4e00; }
      .decision-text { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #633c01; }
      .card { stroke-width: 1.5; }
      .npm-card { fill: #fff1f0; stroke: #cf222e; }
      .node-card { fill: #dafbe1; stroke: #1a7f37; }
      .how-card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
      .track { stroke: #8c959f; stroke-width: 3; }
      .decision-line { stroke: #bf8700; stroke-width: 4; stroke-dasharray: 2 9; stroke-linecap: round; }
      .decision-card { fill: #fff8c5; stroke: #bf8700; stroke-width: 1.5; }
      .arrow { fill: #8c959f; }
      .node { fill: #1a7f37; stroke: #ffffff; stroke-width: 4; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1f2328" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1100" height="800" rx="16" fill="#f6f8fa"/>
  <g transform="translate(-30 20)">
  <text class="title" x="580" y="48" text-anchor="middle">npm release to Node.js release</text>
  <text class="subtitle" x="580" y="78" text-anchor="middle">Progress flows left to right from npm release planning to a published Node.js version.</text>
  <rect x="416" y="96" width="16" height="16" rx="3" fill="#fff1f0" stroke="#cf222e"/>
  <text class="legend" x="441" y="109">npm responsibility</text>
  <rect x="584" y="96" width="16" height="16" rx="3" fill="#dafbe1" stroke="#1a7f37"/>
  <text class="legend" x="609" y="109">Node.js responsibility</text>

  <line class="track" x1="150" y1="145" x2="1010" y2="145"/>
  <path class="arrow" d="M1022 145 L1004 135 L1004 155 Z"/>
  <line class="decision-line" x1="258" y1="166" x2="258" y2="390"/>

  <g transform="translate(55 0)">
    <circle class="node" cx="95" cy="145" r="22"/>
    <text class="number" x="95" y="145">1</text>
    <rect class="card npm-card" x="0" y="190" width="190" height="180" rx="12" filter="url(#shadow)"/>
    <text class="constant" x="95" y="225">NPM_RELEASE_PR</text>
    <text class="signal" x="95" y="270">Open npm/cli PR</text>
    <text class="signal" x="95" y="293">with a release version</text>
    <text class="signal" x="95" y="316">and the label</text>
    <text class="signal" x="95" y="339">autorelease: pending</text>
  </g>

  <g transform="translate(270 0)">
    <circle class="node" cx="95" cy="145" r="22"/>
    <text class="number" x="95" y="145">2</text>
    <rect class="card npm-card" x="0" y="190" width="190" height="180" rx="12" filter="url(#shadow)"/>
    <text class="constant" x="95" y="225">AWAITING_NODE_PR</text>
    <text class="signal" x="95" y="270">Version is published</text>
    <text class="signal" x="95" y="293">to npm, but no</text>
    <text class="signal" x="95" y="316">matching Node.js PR</text>
    <text class="signal" x="95" y="339">or branch contains it</text>
  </g>

  <g transform="translate(485 0)">
    <circle class="node" cx="95" cy="145" r="22"/>
    <text class="number" x="95" y="145">3</text>
    <rect class="card node-card" x="0" y="190" width="190" height="180" rx="12" filter="url(#shadow)"/>
    <text class="constant" x="95" y="225">NODE_PR_REVIEW</text>
    <text class="signal" x="95" y="270">Matching open</text>
    <text class="signal" x="95" y="293">nodejs/node npm</text>
    <text class="signal" x="95" y="316">upgrade PR exists</text>
    <text class="signal" x="95" y="339">for the version</text>
  </g>

  <g transform="translate(700 0)">
    <circle class="node" cx="95" cy="145" r="22"/>
    <text class="number" x="95" y="145">4</text>
    <rect class="card node-card" x="0" y="190" width="190" height="180" rx="12" filter="url(#shadow)"/>
    <text class="constant" x="95" y="225">NODE_MERGED</text>
    <text class="signal" x="95" y="270">A Node.js staging or</text>
    <text class="signal" x="95" y="293">release branch has</text>
    <text class="signal" x="95" y="316">the npm version, but</text>
    <text class="signal" x="95" y="339">no Node.js release does</text>
  </g>

  <g transform="translate(915 0)">
    <circle class="node" cx="95" cy="145" r="22"/>
    <text class="number" x="95" y="145">5</text>
    <rect class="card node-card" x="0" y="190" width="190" height="180" rx="12" filter="url(#shadow)"/>
    <text class="constant" x="95" y="225">NODE_RELEASED</text>
    <text class="signal" x="95" y="270">A published Node.js</text>
    <text class="signal" x="95" y="293">release index entry</text>
    <text class="signal" x="95" y="316">bundles the</text>
    <text class="signal" x="95" y="339">npm version</text>
  </g>

  <rect class="decision-card" x="55" y="390" width="1050" height="68" rx="12"/>
  <text class="decision-title" x="77" y="418">Is it a new npm major version?</text>
  <text class="decision-text" x="77" y="441">The Node.js Release team discusses which Node.js version lines, if any, should receive the npm major or whether integration should wait for the next release.</text>

  <line x1="55" y1="490" x2="1105" y2="490" stroke="#d0d7de"/>
  <text class="how-title" x="55" y="526">How the pipeline starts</text>

  <rect class="how-card" x="55" y="546" width="400" height="207" rx="12"/>
  <text class="how-title" x="77" y="576">1. Automatic npm release PR</text>
  <text class="how-text" x="77" y="601">Release Please reads Conventional Commits</text>
  <text class="how-text" x="77" y="623">to determine the next version, then opens or</text>
  <text class="how-text" x="77" y="645">updates the npm/cli release PR.</text>

  <rect class="how-card" x="480" y="546" width="625" height="207" rx="12"/>
  <text class="how-title" x="502" y="576">2. npm team creates the Node.js PR</text>
  <text class="routing-label" x="502" y="602">Shared with Node.js mainline</text>
  <rect class="command-bg" x="494" y="608" width="597" height="34" rx="6"/>
  <text class="command" x="506" y="630">gh workflow run create-node-pr.yml -R npm/cli -f spec=next-11</text>
  <text class="how-text" x="502" y="664">Create only the main PR, even when multiple Node.js lines use this npm line.</text>
  <text class="routing-label" x="502" y="688">Older npm line used by an LTS branch</text>
  <rect class="command-bg" x="494" y="696" width="597" height="34" rx="6"/>
  <text class="command" x="506" y="718">gh workflow run create-node-pr.yml -R npm/cli -f spec=next-10 -f branch=22</text>
  </g>
</svg>
